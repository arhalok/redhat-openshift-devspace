<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Spaces Test Page</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #ee0000; /* Red Hat Red */
      --primary-hover: #cc0000;
      --border: #e2e8f0;
      --success: #16a34a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    header {
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      background-color: rgba(22, 163, 74, 0.15);
      color: var(--success);
      margin-bottom: 0.75rem;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .test-output {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.875rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      word-break: break-all;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="badge">Online</div>
      <h1>Test Page</h1>
      <p>Simple test page running in the OpenShift Dev Spaces environment.</p>
    </header>

    <section aria-label="Interactive Test Area">
      <div class="actions">
        <button type="button" id="btn-test">Click to Test Interaction</button>
      </div>
      <div id="output" class="test-output">Status: Waiting for interaction...</div>
    </section>

    <footer>
      Environment: OpenShift Dev Spaces
    </footer>
  </main>

  <script>
    const testButton = document.getElementById('btn-test');
    const output = document.getElementById('output');
    let clickCount = 0;

    testButton.addEventListener('click', () => {
      clickCount++;
      output.textContent = `Success: JavaScript interactive! (Clicked ${clickCount} time${clickCount === 1 ? '' : 's'})`;
      output.style.color = 'var(--success)';
    });
  </script>
</body>
</html>
