schemaVersion: 2.2.0
metadata:
  name: redhat-openshift-devspace
  version: 1.0.0
  displayName: Node.js & TypeScript Cloud Workspace
  description: Lightweight cloud-native development environment for Red Hat OpenShift Dev Spaces.
  tags:
    - Node.js
    - TypeScript
    - OpenShift
    - DevSpaces
  projectType: nodejs
  language: typescript
components:
  - name: universal-developer-image
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      mountSources: true
      sourceMapping: /projects
      env:
        - name: HOST_USERS
          value: "false"
      memoryLimit: 2048Mi
      memoryRequest: 512Mi
      cpuLimit: 1500m
      cpuRequest: 250m
      endpoints:
        - name: node-app
          targetPort: 3000
          exposure: public
          protocol: http
commands:
  - id: install-dependencies
    exec:
      label: "1. Install Dependencies"
      component: universal-developer-image
      workingDir: ${PROJECT_SOURCE}
      commandLine: "npm install"
      group:
        kind: build
        isDefault: true
  - id: run-dev
    exec:
      label: "2. Run Development Server"
      component: universal-developer-image
      workingDir: ${PROJECT_SOURCE}
      commandLine: "npm run dev"
      group:
        kind: run
        isDefault: true
